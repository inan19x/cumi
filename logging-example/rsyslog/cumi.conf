# /etc/rsyslog.d/cumi.conf

input(
    type="imfile"
    File="/opt/cumi/logs/cumi.log"
    Tag="cumi"
    Facility="local6"
    Severity="info"
    PersistStateInterval="100"
)

if $programname == "cumi" then {
    action(
        type="omfwd"
        Target="<SYSLOG_HOST>"
        Port="514"
        Protocol="tcp"
        TCP_Framing="octet-counted"
        KeepAlive="on"
        Action.ResumeRetryCount="-1"
    )
    stop
}


